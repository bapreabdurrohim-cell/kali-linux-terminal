<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kali Linux Terminal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#10121a;color:#d8dee9;font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace}
.terminal{width:min(100%,950px);height:100vh;height:100dvh;margin:auto;background:#1a1c28;border:1px solid #2c3250;display:flex;flex-direction:column;padding:12px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}
header{padding:11px 14px;border-bottom:1px solid #2c3250;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#aab4cf}
.dots{display:flex;gap:6px;width:42px}
.dots i{width:10px;height:10px;border-radius:50%;background:#3b4363}
.sp{width:42px}
#title{font-weight:normal;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{color:#7aa2f7}
#screen{font-size:14px;flex:1;min-height:0;overflow:auto;padding:15px 5px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.banner{color:#7aa2f7;font-weight:bold}
.muted{color:#7f8aa3;margin-bottom:10px}
.cyan{color:#e6e9f2}
.error{color:#ff6b6b}
.at{font-family:Arial,Helvetica,sans-serif;font-weight:normal}
.b{color:#5b8cff}
.r{color:#ff4d4d;font-weight:bold}
.p{color:#fff;font-weight:bold}
.inputbar{margin-top:12px;display:flex;flex-direction:column;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:8px}
input{flex:1;min-width:0;background:transparent;color:#fff;border:0;outline:0;font:inherit}
button{background:#232a47;color:#9ec1ff;border:1px solid #3b4a7a;padding:8px 12px;font:inherit;cursor:pointer;border-radius:4px}
.output{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.prompt{color:#7aa2f7}
</style>
</head>
<body>
<main class="terminal">
<header>
<span class="dots"><i></i><i></i><i></i></span>
<b id="title">root@kali: ~/Desktop</b>
<span class="sp"></span>
</header>
<section id="screen">
<div class="banner">Kali GNU/Linux Rolling</div>
<div class="muted">Linux kali 6.5.0-kali3-amd64 x86_64
Last login: Tue Oct 13 11:58:02 2026 from 192.168.1.5</div>
<div id="history-output"></div>
<form class="inputbar" id="form">
<div id="p1"></div>
<div class="row"><span id="p2"></span><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus enterkeyhint="send"></div>
</form>
</section>
</main>
<script>
"use strict";

const $ = id => document.getElementById(id);
const screen = $("screen");
const output = $("history-output");
const input = $("cmd");
const form = $("form");

const HOME = ["home","kali"];
const F = (content="", mode="-rw-r--r--") => ({ type:"file", content:String(content), mode });
const D = (children={}) => ({ type:"dir", children });
const clone = n => JSON.parse(JSON.stringify(n));

let fs = D({
  home:D({
    kali:D({
      "readme.txt":F("Welcome to Kali Linux Terminal!\nType 'help' to see all commands."),
      Desktop:D({ops:D(),scan:D()}),
      Documents:D(),
      Downloads:D()
    })
  }),
  tmp:D(),
  root:D(),
  var:D({
    log:D({
      syslog:F("Oct 13 12:00:01 kali systemd[1]: Started Session 1.\nOct 13 12:00:05 kali sshd[812]: Server listening on 0.0.0.0 port 22.")
    })
  }),
  etc:D({
    hostname:F("kali"),
    "os-release":F('PRETTY_NAME="Kali GNU/Linux Rolling"\nNAME="Kali GNU/Linux"\nID=kali'),
    passwd:F("root:x:0:0:root:/root:/bin/bash\nkali:x:1000:1000:kali:/home/kali:/bin/bash")
  }),
  usr:D({bin:D(),share:D()}),
  bin:D()
});

let cwd = [...HOME,"Desktop"];
let prev = [...HOME];
let hist = [];
let histIndex = 0;
let status = 0;
let user = "root";
let aliases = {};
let env = {
  USER:"kali",
  HOME:"/home/kali",
  SHELL:"/bin/bash",
  PATH:"/usr/local/bin:/usr/bin:/bin",
  LANG:"en_US.UTF-8",
  TERM:"xterm-256color",
  HOSTNAME:"kali"
};

function fail(message){ throw new Error(String(message)); }

function norm(path="."){
  path = String(path || ".");
  let parts = path.startsWith("/") ? [] : [...cwd];
  if(path === "~" || path.startsWith("~/")){
    parts = [...HOME];
    path = path.slice(1);
  }
  for(const part of path.split("/")){
    if(!part || part === ".") continue;
    if(part === "..") parts.pop();
    else parts.push(part);
  }
  return parts;
}

function node(parts){
  let current = fs;
  for(const part of parts){
    if(current.type !== "dir" || !current.children[part]) return null;
    current = current.children[part];
  }
  return current;
}
function resolve(path="."){ return node(norm(path)); }

function readf(path){
  const n = resolve(path);
  if(!n) fail("cat: " + path + ": No such file or directory");
  if(n.type === "dir") fail("cat: " + path + ": Is a directory");
  return n.content;
}

function write(path, text, append=false){
  if(path === "/dev/null") return;
  const parts = norm(path);
  const name = parts.pop();
  if(!name) fail("cannot write to this path");
  const dir = node(parts);
  if(!dir || dir.type !== "dir") fail(path + ": No such file or directory");
  const old = dir.children[name];
  if(old && old.type === "dir") fail(path + ": Is a directory");
  dir.children[name] = F((append && old ? old.content : "") + text,
                         old ? old.mode : "-rw-r--r--");
}

function splitPath(path){
  const parts = norm(path);
  const name = parts.pop();
  const dir = node(parts);
  if(!name || !dir || dir.type !== "dir") fail(path + ": No such file or directory");
  return [dir,name];
}

function parseFlags(args){
  const flags = new Set(), rest = [];
  for(const arg of args){
    if(arg.length > 1 && arg[0] === "-" && !arg.startsWith("--")){
      for(const ch of arg.slice(1)) flags.add(ch);
    }else rest.push(arg);
  }
  return [flags,rest];
}

function lines(text){ return String(text).replace(/\n$/,"\").split("\n"); }
function sizeOf(n){
  if(n.type === "file") return n.content.length;
  return Object.values(n.children).reduce((sum,c)=>sum+sizeOf(c),0);
}
function walk(n,path,fn){
  fn(n,path);
  if(n.type === "dir"){
    for(const name of Object.keys(n.children).sort()){
      walk(n.children[name],path.replace(/\/\$/,"")+"/"+name,fn);
    }
  }
}
function updatePrompt(){
  const path = "/"+cwd.join("/");
  const home = "/home/kali";
  const display = path === home ? "~" : path.startsWith(home+"/") ? "~"+path.slice(home.length) : path;
  $("title").textContent = user+"@kali: "+display;
  $("p1").textContent = "";
  $("p2").innerHTML = '<span class="prompt">'+escapeHTML(user+"@kali")+'</span>'+
    '<span class="at">:</span><span class="b">'+escapeHTML(display)+'</span>'+
    (user === "root" ? '<span class="r">#</span> ' : '<span class="p">$</span> ');
}
function escapeHTML(text){
  return String(text).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function print(text="",className=""){
  const div = document.createElement("div");
  div.className = "output"+(className ? " "+className : "");
  div.textContent = String(text);
  output.appendChild(div);
}
function clearScreen(){ output.textContent = ""; }
function expand(text){
  return String(text).replace(/\$(\w+|\?|\{[^}]+\})/g,(match,key)=>{
    key = key.replace(/^\{|\}$/g,"");
    if(key === "?") return String(status);
    return env[key] ?? "";
  });
}
function tokenize(source){
  const tokens = [];
  let word = "", quote = "", escaped = false;
  for(let i=0;i<source.length;i++){
    const ch = source[i];
    if(escaped){ word += ch; escaped = false; continue; }
    if(ch === "\\" && quote !== "'"){ escaped = true; continue; }
    if(quote){
      if(ch === quote) quote = "";
      else word += ch;
      continue;
    }
    if(ch === "'" || ch === '"'){ quote = ch; continue; }
    if(/\s/.test(ch)){
      if(word){ tokens.push(word); word = ""; }
      continue;
    }
    word += ch;
  }
  if(escaped) word += "\\";
  if(quote) fail("syntax error: unmatched quote");
  if(word) tokens.push(word);
  return tokens.map(expand);
}

const C = {
  help(){
    return "GNU bash, version 5.2.15\nAvailable commands:\n"+
      Object.keys(C).sort().join("  ")+
      "\n\nUse 'man <command>' for command information.";
  },
  pwd(){ return "/"+cwd.join("/"); },
  ls(args=[]){
    const [flags,rest] = parseFlags(args), path = rest[0] || ".", n = resolve(path);
    if(!n) fail("ls: cannot access '"+path+"': No such file or directory");
    if(n.type === "file") return path;
    let names = Object.keys(n.children).sort();
    if(flags.has("a")) names = [".","..",...names];
    else names = names.filter(name=>!name.startsWith("."));
    if(flags.has("l")){
      return "total "+names.length+"\n"+names.map(name=>{
        const child = n.children[name] || D();
        const mode = child.type === "dir" ? "drwxr-xr-x" : child.mode;
        const size = child.type === "file" ? child.content.length : 4096;
        return mode+" 1 "+user+" "+user+" "+String(size).padStart(5)+" Oct 13 12:00 "+name;
      }).join("\n");
    }
    return names.map(name=>n.children[name]?.type === "dir" ? name+"/" : name).join("   ") || "(empty directory)";
  },
  cd(args=[]){
    const target = args[0] || "~";
    if(target === "-"){
      const old = cwd; cwd = [...prev]; prev = old;
    }else{
      const path = norm(target), n = node(path);
      if(!n) fail("cd: "+target+": No such file or directory");
      if(n.type !== "dir") fail("cd: "+target+": Not a directory");
      prev = [...cwd]; cwd = path;
    }
    updatePrompt(); return "";
  },
  mkdir(args=[]){
    const [flags,rest] = parseFlags(args);
    if(!rest.length) fail("mkdir: missing operand");
    for(const path of rest){
      const parts = norm(path), name = parts.pop(), parent = node(parts);
      if(flags.has("p")){
        let current = fs;
        for(const part of norm(path)){
          if(!current.children[part]) current.children[part] = D();
          if(current.children[part].type !== "dir") fail("mkdir: Not a directory");
          current = current.children[part];
        }
        continue;
      }
      if(!parent || parent.type !== "dir") fail("mkdir: cannot create directory '"+path+"': No such file or directory");
      if(parent.children[name]) fail("mkdir: cannot create directory '"+path+"': File exists");
      parent.children[name] = D();
    }
    return "";
  },
  touch(args=[]){
    if(!args.length) fail("touch: missing file operand");
    for(const path of args){
      if(resolve(path)) continue;
      const [dir,name] = splitPath(path); dir.children[name] = F("");
    }
    return "";
  },
  cat(args=[],stdin=null){
    if(!args.length) return stdin ?? "";
    return args.map(path=>readf(path)).join("\n");
  },
  tac(args=[],stdin=null){ return lines(this.cat(args,stdin)).reverse().join("\n"); },
  rev(args=[],stdin=null){ return lines(this.cat(args,stdin)).map(line=>[...line].reverse().join("")).join("\n"); },
  echo(args=[]){ return args.filter(x=>x!=="-n"&&x!=="-e").join(" "); },
  printf(args=[]){
    let format = args.shift() || "", index = 0;
    format = format.replace(/\\n/g,"\n").replace(/\\t/g,"\t");
    return format.replace(/%[sdif]/g,token=>{
      const value = args[index++] ?? "";
      if(token === "%d" || token === "%i" || token === "%f"){
        const num = Number(value); return Number.isFinite(num) ? String(num) : "0";
      }
      return String(value);
    });
  },
  rm(args=[]){
    const [flags,rest] = parseFlags(args);
    if(!rest.length) fail("rm: missing operand");
    for(const path of rest){
      const [dir,name] = splitPath(path), child = dir.children[name];
      if(!child){ if(flags.has("f")) continue; fail("rm: cannot remove '"+path+"': No such file or directory"); }
      if(child.type === "dir" && !flags.has("r") && !flags.has("R")) fail("rm: cannot remove '"+path+"': Is a directory");
      delete dir.children[name];
    }
    return "";
  },
  rmdir(args=[]){
    if(!args.length) fail("rmdir: missing operand");
    for(const path of args){
      const [dir,name] = splitPath(path), child = dir.children[name];
      if(!child || child.type !== "dir") fail("rmdir: failed to remove '"+path+"': Not a directory");
      if(Object.keys(child.children).length) fail("rmdir: failed to remove '"+path+"': Directory not empty");
      delete dir.children[name];
    }
    return "";
  },
  cp(args=[]){
    const [flags,rest] = parseFlags(args);
    if(rest.length < 2) fail("cp: missing destination file operand");
    const destination = rest.pop(), destNode = resolve(destination);
    for(const source of rest){
      const original = resolve(source);
      if(!original) fail("cp: cannot stat '"+source+"': No such file or directory");
      if(original.type === "dir" && !flags.has("r") && !flags.has("R")) fail("cp: -r not specified; omitting directory '"+source+"'");
      if(destNode && destNode.type === "dir") destNode.children[source.split("/").filter(Boolean).pop()] = clone(original);
      else { const [dir,name] = splitPath(destination); dir.children[name] = clone(original); }
    }
    return "";
  },
  mv(args=[]){
    if(args.length < 2) fail("mv: missing destination operand");
    const destination = args.pop();
    for(const source of args){
      const [sourceDir,name] = splitPath(source), item = sourceDir.children[name];
      if(!item) fail("mv: cannot stat '"+source+"': No such file or directory");
      const destNode = resolve(destination);
      if(destNode && destNode.type === "dir") destNode.children[name] = item;
      else { const [destDir,destName] = splitPath(destination); destDir.children[destName] = item; }
      delete sourceDir.children[name];
    }
    return "";
  },
  ln(args=[]){
    const [,rest] = parseFlags(args);
    if(rest.length < 2) fail("ln: missing file operand");
    const source = resolve(rest[0]);
    if(!source) fail("ln: failed to access '"+rest[0]+"'");
    const [dir,name] = splitPath(rest[1]); dir.children[name] = clone(source); return "";
  },
  head(args=[],stdin=null){
    let count = 10; const rest = [...args];
    if(rest[0] === "-n"){ count = Number(rest[1] || 10); rest.splice(0,2); }
    else if(/^\-\d+$/.test(rest[0] || "")) count = Number(rest.shift().slice(1));
    return lines(this.cat(rest,stdin)).slice(0,Math.max(0,count)).join("\n");
  },
  tail(args=[],stdin=null){
    let count = 10; const rest = [...args];
    if(rest[0] === "-n"){ count = Number(rest[1] || 10); rest.splice(0,2); }
    else if(/^\-\d+$/.test(rest[0] || "")) count = Number(rest.shift().slice(1));
    return lines(this.cat(rest,stdin)).slice(-Math.max(0,count)).join("\n");
  },
  wc(args=[],stdin=null){
    const [flags,rest] = parseFlags(args), text = this.cat(rest,stdin);
    const lc = text ? text.replace(/\n$/,"\").split("\n").length : 0;
    const wc = text.trim() ? text.trim().split(/\s+/).length : 0, cc = text.length, values = [];
    if(flags.has("l") || flags.size===0) values.push(lc);
    if(flags.has("w") || flags.size===0) values.push(wc);
    if(flags.has("c") || flags.size===0) values.push(cc);
    return values.join(" ")+(rest[0] ? " "+rest[0] : "");
  },
  sort(args=[],stdin=null){
    const [flags,rest] = parseFlags(args); let result = lines(this.cat(rest,stdin));
    if(flags.has("n")) result.sort((a,b)=>Number(a)-Number(b)); else result.sort();
    if(flags.has("r")) result.reverse();
    if(flags.has("u")) result = [...new Set(result)];
    return result.join("\n");
  },
  uniq(args=[],stdin=null){
    const [flags,rest] = parseFlags(args), result = [];
    for(const line of lines(this.cat(rest,stdin))){
      const last = result[result.length-1];
      if(last && last[0]===line) last[1]++; else result.push([line,1]);
    }
    return result.map(([line,count])=>flags.has("c") ? String(count).padStart(7)+" "+line : line).join("\n");
  },
  grep(args=[],stdin=null){
    const [flags,rest] = parseFlags(args), pattern = rest.shift();
    if(pattern===undefined) fail("grep: missing search pattern");
    let regex;
    try{ regex = new RegExp(pattern,flags.has("i") ? "i" : ""); }
    catch{ fail("grep: invalid regular expression"); }
    const found = [];
    for(const [index,line] of lines(this.cat(rest,stdin)).entries()){
      const match = regex.test(line);
      if(match !== flags.has("v")) found.push(flags.has("n") ? (index+1)+":"+line : line);
    }
    if(flags.has("c")) return String(found.length);
    if(!found.length) status = 1;
    return found.join("\n");
  },
  cut(args=[],stdin=null){
    const di=args.indexOf("-d"), fi=args.indexOf("-f");
    const delimiter=di>=0 ? args[di+1] : "\t", fieldText=fi>=0 ? args[fi+1] : "1";
    const fields=fieldText.split(",").map(Number);
    const rest=args.filter((x,i)=>i!==di&&i!==di+1&&i!==fi&&i!==fi+1&&!x.startsWith("-"));
    return lines(this.cat(rest,stdin)).map(line=>line.split(delimiter).filter((_,i)=>fields.includes(i+1)).join(delimiter)).join("\n");
  },
  tr(args=[],stdin=null){
    const [flags,rest]=parseFlags(args), from=rest[0]||"", to=rest[1]||"", text=stdin??"";
    return [...text].map(ch=>{
      const i=from.indexOf(ch);
      if(i<0) return ch;
      if(flags.has("d")) return "";
      return to[Math.min(i,to.length-1)]||"";
    }).join("");
  },
  sed(args=[],stdin=null){
    const rest=args.filter(x=>!x.startsWith("-")), expression=rest.shift()||"";
    const match=expression.match(/^s(.)(.*?)\1(.*?)\1([gi]*)$/);
    if(!match) fail("sed: only s/old/new/[g] is supported");
    let regex; try{regex=new RegExp(match[2],match[4]);}catch{fail("sed: invalid regular expression");}
    return lines(this.cat(rest,stdin)).map(line=>line.replace(regex,match[3])).join("\n");
  },
  awk(args=[],stdin=null){
    const rest=[...args]; let separator=/\s+/;
    const fi=rest.indexOf("-F");
    if(fi>=0){separator=rest[fi+1]||/\s+/;rest.splice(fi,2);}
    const program=rest.shift()||"", match=program.match(/\{\s*print\s*(.*?)\s*\}/);
    if(!match) fail("awk: only '{print $N}' is supported");
    const fields=match[1] ? match[1].split(/\s*,\s*/) : ["$0"];
    return lines(this.cat(rest,stdin)).map(line=>{
      const columns=[line,...line.trim().split(separator)];
      return fields.map(field=>{
        if(field==="$0") return line;
        if(/^\$\d+$/.test(field)) return columns[Number(field)]??"";
        return field.replace(/^['"]|['"]$/g,"");
      }).join(" ");
    }).join("\n");
  },
  tee(args=[],stdin=null){
    const append=args.includes("-a"), paths=args.filter(x=>x!=="-a"), text=stdin??"";
    for(const path of paths) write(path,text+(text&&!text.endsWith("\n")?"\n":""),append);
    return text;
  },
  find(args=[]){
    const start=args[0]&&!args[0].startsWith("-")?args[0]:".", index=args.indexOf("-name"), pattern=index>=0?args[index+1]:null;
    const root=resolve(start);
    if(!root) fail("find: '"+start+"': No such file or directory");
    const wildcard=pattern?new RegExp("^"+pattern.replace(/[.+^${}()|[\]\\]/g,"\\$&").replace(/\*/g,".*").replace(/\?/g,".")+"$"):null;
    const results=[];
    walk(root,start.replace(/\/\$/,""),(item,path)=>{if(!wildcard||wildcard.test(path.split("/").pop())) results.push(path);});
    return results.join("\n");
  },
  tree(args=[]){
    const start=args[0]||".", root=resolve(start);
    if(!root||root.type!=="dir") fail("tree: error opening directory");
    let dirs=0,files=0;
    function build(dir,prefix){
      return Object.keys(dir.children).sort().map((name,index,names)=>{
        const last=index===names.length-1, child=dir.children[name];
        const line=prefix+(last?"└── ":"├── ")+name;
        if(child.type==="dir"){dirs++;const sub=build(child,prefix+(last?"    ":"│   "));return line+(sub?"\n"+sub:"");}
        files++;return line;
      }).join("\n");
    }
    return start+"\n"+build(root,"")+"\n\n"+dirs+" directories, "+files+" files";
  },
  stat(args=[]){
    const path=args[0]||".", item=resolve(path);
    if(!item) fail("stat: cannot stat '"+path+"': No such file or directory");
    return "  File: "+path+"\n  Size: "+sizeOf(item)+"\n  Type: "+(item.type==="dir"?"directory":"regular file")+"\n  Owner: "+user;
  },
  file(args=[]){
    return args.map(path=>{
      const item=resolve(path);
      if(!item) return path+": cannot open (No such file or directory)";
      if(item.type==="dir") return path+": directory";
      return path+": "+(item.content?"ASCII text":"empty");
    }).join("\n");
  },
  du(args=[]){
    const path=args[0]||".", item=resolve(path);
    if(!item) fail("du: cannot access '"+path+"'");
    return Math.ceil(sizeOf(item)/1024)+"\t"+path;
  },
  df(){return "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1        50G   18G   30G  38% /\ntmpfs           2.0G     0  2.0G   0% /dev/shm";},
  free(){return "               total        used        free      shared  buff/cache   available\nMem:         4028316     1204512     1890204       23112      933600     2603804\nSwap:        2097148           0     2097148";},
  lsblk(){return "NAME   MAJ:MIN RM  SIZE RO TYPE MOUNTPOINTS\nsda      8:0    0   50G  0 disk\n└─sda1   8:1    0   50G  0 part /";},
  lscpu(){return "Architecture:        x86_64\nCPU(s):              4\nModel name:          Virtual CPU @ 2.60GHz\nThread(s) per core:  2";},
  nproc(){return "4";}, arch(){return "x86_64";},
  dmesg(){return "[    0.000000] Linux version 6.5.0-kali3-amd64\n[    0.412000] smpboot: CPU0: Virtual CPU\n[    1.203000] EXT4-fs (sda1): mounted filesystem";},
  ps(){return "  PID TTY          TIME CMD\n 1331 pts/0    00:00:00 bash\n 1450 pts/0    00:00:00 python3\n 1892 pts/0    00:00:00 ps";},
  top(){return "top - 12:00:00 up 4 days, 2 users, load average: 0.15, 0.22, 0.18\nTasks: 112 total, 1 running\n%Cpu(s):  2.1 us, 0.7 sy, 97.0 id\nMiB Mem : 3934.0 total, 1845.9 free, 1176.3 used\n\n  PID USER   %CPU %MEM COMMAND\n 1450 kali    0.7  0.5 python3\n    1 root    0.0  0.1 systemd";},
  env(){return Object.entries(env).map(([key,value])=>key+"="+value).join("\n");},
  printenv(args=[]){return args.length?(env[args[0]]??""):this.env();},
  export(args=[]){
    for(const arg of args){const i=arg.indexOf("=");if(i>0){const key=arg.slice(0,i);if(/^\w+$/.test(key))env[key]=arg.slice(i+1);}}
    return "";
  },
  unset(args=[]){args.forEach(key=>delete env[key]);return "";},
  set(){return this.env();},
  alias(args=[]){
    if(!args.length) return Object.entries(aliases).map(([key,value])=>"alias "+key+"='"+value+"'").join("\n");
    for(const arg of args){const i=arg.indexOf("=");if(i>0)aliases[arg.slice(0,i)]=arg.slice(i+1);}
    return "";
  },
  unalias(args=[]){args.forEach(key=>delete aliases[key]);return "";},
  which(args=[]){return args.filter(name=>C[name]).map(name=>"/usr/bin/"+name).join("\n");},
  type(args=[]){return args.map(name=>C[name]?name+" is /usr/bin/"+name:"bash: type: "+name+": not found").join("\n");},
  man(args=[]){
    if(!args[0]) fail("What manual page do you want?");
    if(!C[args[0]]) fail("No manual entry for "+args[0]);
    return args[0].toUpperCase()+"(1)\n\nNAME\n       "+args[0]+" - command line utility\n\nSYNOPSIS\n       "+args[0]+" [OPTION]... [FILE]...";
  },
  whoami(){return user;},
  id(){return user==="root"?"uid=0(root) gid=0(root) groups=0(root)":"uid=1000(kali) gid=1000(kali) groups=1000(kali),27(sudo),100(users)";},
  groups(){return user==="root"?"root":"kali sudo users";},
  who(){return "kali     pts/0        2026-10-13 11:58\nkali     pts/1        2026-10-13 12:02";},
  w(){return " 12:00:00 up 4 days, 2 users, load average: 0.15\n"+this.who();},
  last(){return "kali     pts/0        192.168.1.5      Tue Oct 13 11:58   still logged in";},
  hostname(){return "kali";},
  date(){return new Date().toString();},
  cal(){
    const date=new Date(),year=date.getFullYear(),month=date.getMonth(),first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();
    let result=date.toLocaleString("en",{month:"long"})+" "+year+"\nSu Mo Tu We Th Fr Sa\n"+"   ".repeat(first);
    for(let day=1;day<=count;day++){result+=String(day).padStart(2)+" ";if((first+day)%7===0)result+="\n";}
    return result;
  },
  uptime(){return " 12:00:00 up 4 days, 1:20, 2 users, load average: 0.15, 0.22, 0.18";},
  uname(args=[]){
    if(args.includes("-a")) return "Linux kali 6.5.0-kali3-amd64 #1 SMP x86_64 GNU/Linux";
    if(args.includes("-r")) return "6.5.0-kali3-amd64";
    if(args.includes("-n")) return "kali";
    if(args.includes("-m")) return "x86_64";
    return "Linux";
  },
  lsb_release(){return "Distributor ID:\tKali\nDescription:\tKali GNU/Linux Rolling\nRelease:\trolling";},
  neofetch(){return user+"@kali\n---------\nOS: Kali GNU/Linux Rolling x86_64\nKernel: 6.5.0-kali3-amd64\nUptime: 4 days\nShell: bash 5.2.15\nCPU: Virtual CPU (4)\nMemory: 1176MiB / 3934MiB";},
  history(){return hist.map((command,index)=>String(index+1).padStart(5)+"  "+command).join("\n");},
  clear(){clearScreen();return "";}, reset(){clearScreen();return "";},
  exit(){if(user==="root"){user="kali";updatePrompt();return "logout";}return "logout";},
  sudo(args=[],stdin=null){
    if(!args.length) fail("usage: sudo command");
    if(args[0]==="-i"||args[0]==="su"){user="root";updatePrompt();return "";}
    return call(args,stdin);
  },
  su(){user="root";updatePrompt();return "";},
  passwd(){return "passwd: password updated successfully";},
  chmod(args=[]){
    if(args.length<2) fail("chmod: missing operand");
    const mode=args.shift();
    for(const path of args){
      const item=resolve(path);
      if(!item) fail("chmod: cannot access '"+path+"': No such file or directory");
      if(item.type!=="file") continue;
      if(/^\d{3,4}$/.test(mode)){
        const bits=mode.slice(-3).split("").map(Number);
        item.mode="-"+bits.map(n=>(n&4?"r":"-")+(n&2?"w":"-")+(n&1?"x":"-")).join("");
      }else if(mode.includes("+x")) item.mode=item.mode.replace(/-/g,"x");
      else if(mode.includes("-x")) item.mode=item.mode.replace(/x/g,"-");
    }
    return "";
  },
  chown(args=[]){if(args.length<2) fail("chown: missing operand");return "";},
  basename(args=[]){return (args[0]||"").split("/").filter(Boolean).pop()||"/";},
  dirname(args=[]){const parts=(args[0]||"").split("/");parts.pop();return parts.join("/")||".";},
  realpath(args=[]){return "/"+norm(args[0]||".").join("/");},
  seq(args=[]){
    const values=args.map(Number);let start,step,end;
    if(values.length===1)[start,step,end]=[1,1,values[0]];
    else if(values.length===2)[start,step,end]=[values[0],1,values[1]];
    else if(values.length===3)[start,step,end]=values;
    else fail("seq: usage: seq [FIRST [INCREMENT]] LAST");
    if(![start,step,end].every(Number.isFinite)||step===0) fail("seq: invalid numeric argument");
    const result=[];
    for(let value=start;(step>0?value<=end:value>=end)&&result.length<1000;value+=step) result.push(String(value));
    return result.join("\n");
  },
  yes(args=[]){return Array(10).fill(args[0]||"y").join("\n")+"\n...";},
  expr(args=[]){
    const expression=args.join(" ");
    if(!/^[\d\s()+*/%.-]+$/.test(expression)) fail("expr: syntax error");
    try{return String(Function('"use strict";return ('+expression+')')());}catch{fail("expr: syntax error");}
  },
  bc(args=[],stdin=null){return lines(args.join(" ")||stdin||"").map(line=>this.expr([line])).join("\n");},
  factor(args=[]){
    let n=Math.abs(Number(args[0]));
    if(!Number.isInteger(n)||n<1) fail("factor: invalid integer");
    const original=n,factors=[];
    for(let i=2;i*i<=n;i++) while(n%i===0){factors.push(i);n/=i;}
    if(n>1) factors.push(n);
    return original+": "+factors.join(" ");
  },
  base64(args=[],stdin=null){
    const [flags,rest]=parseFlags(args),text=rest.length?rest.join(" "):(stdin||"");
    try{
      if(flags.has("d")) return decodeURIComponent(escape(atob(text.trim())));
      return btoa(unescape(encodeURIComponent(text)));
    }catch{fail("base64: invalid input");}
  },
  md5sum(args=[],stdin=null){return "simulated-hash-"+(stdin??args.join(" "))+"  "+(args[0]||"-");},
  sha256sum(args=[],stdin=null){return "simulated-hash-"+(stdin??args.join(" "))+"  "+(args[0]||"-");},
  sha1sum(args=[],stdin=null){return "simulated-hash-"+(stdin??args.join(" "))+"  "+(args[0]||"-");},
  xxd(args=[],stdin=null){
    const text=this.cat(args,stdin),result=[];
    for(let i=0;i<text.length;i+=16){
      const part=text.slice(i,i+16),hex=[...part].map(ch=>ch.charCodeAt(0).toString(16).padStart(2,"0")).join(" ");
      result.push(i.toString(16).padStart(8,"0")+": "+hex.padEnd(47)+"  "+part.replace(/[^\x20-\x7e]/g,"."));
    }
    return result.join("\n");
  },
  strings(args=[],stdin=null){return lines(this.cat(args,stdin)).filter(line=>line.length>=4).join("\n");},
  diff(args=[]){
    if(args.length<2) fail("diff: missing operand");
    const a=lines(readf(args[0])),b=lines(readf(args[1])),result=[];
    for(let i=0;i<Math.max(a.length,b.length);i++) if(a[i]!==b[i]) result.push((i+1)+"c"+(i+1)+"\n< "+(a[i]??"")+"\n---\n> "+(b[i]??""));
    return result.join("\n");
  },
  tar(){return "tar: simulated archive operation";},
  zip(args=[]){return "adding: "+(args.slice(1).join(", ")||"files")+" (deflated 12%)";},
  unzip(args=[]){return "Archive: "+(args[0]||"archive.zip")+"\n  inflating: extracted/";},
  gzip(){return "gzip: simulated compression";}, gunzip(){return "gunzip: simulated decompression";},
  ping(args=[]){
    const host=args.filter(arg=>!arg.startsWith("-")).pop()||"target.com";
    return "PING "+host+" ("+host+") 56(84) bytes of data.\n"+
      [1,2,3].map(i=>"64 bytes from "+host+": icmp_seq="+i+" ttl=64 time="+(10+i*2)+" ms").join("\n")+
      "\n\n--- "+host+" ping statistics ---\n3 packets transmitted, 3 received, 0% packet loss";
  },
  ip(args=[]){
    if(args[0]==="addr"||args[0]==="a") return "1: lo: <LOOPBACK,UP> mtu 65536\n    inet 127.0.0.1/8 scope host lo\n2: eth0: <BROADCAST,MULTICAST,UP> mtu 1500\n    inet 192.168.1.5/24 scope global eth0";
    return "Usage: ip [ OPTIONS ] OBJECT";
  },
  ifconfig(){return "lo: flags=73<UP,LOOPBACK,RUNNING>\n    inet 127.0.0.1  netmask 255.0.0.0\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>\n    inet 192.168.1.5  netmask 255.255.255.0";},
  ss(){return "Netid State  Recv-Q Send-Q Local Address:Port Peer Address:Port\ntcp   LISTEN 0      128    0.0.0.0:22        0.0.0.0:*";},
  netstat(){return "Active Internet connections\nProto Recv-Q Send-Q Local Address Foreign Address State\ntcp        0      0 0.0.0.0:22 0.0.0.0:* LISTEN";},
  nmap(args=[]){
    const host=args.filter(arg=>!arg.startsWith("-")).pop()||"127.0.0.1";
    return "Starting Nmap (simulated)\nNmap scan report for "+host+"\nHost is up (0.0010s latency).\n\nPORT     STATE SERVICE\n22/tcp   open  ssh\n80/tcp   open  http\n443/tcp  open  https\n\nNmap done: 1 IP address (1 host up) scanned";
  },
  python(args=[]){return args.includes("--version")||args.includes("-V")?"Python 3.11.6":"Python command is simulated in this terminal.";},
  python3(args=[]){return this.python(args);},
  node(args=[]){return args.includes("--version")||args.includes("-v")?"v20.10.0":"Node.js command is simulated in this terminal.";},
  npm(args=[]){return args.includes("--version")?"10.2.3":"npm command is simulated.";},
  git(args=[]){if(args[0]==="--version")return "git version 2.39.2";if(args[0]==="status")return "On branch main\nnothing to commit, working tree clean";return "git: simulated command";},
  apt(args=[]){if(args[0]==="update")return "Reading package lists... Done\nBuilding dependency tree... Done\nAll packages are up to date.";if(args[0]==="list")return "Listing... Done";return "apt: simulated package manager";},
  true(){status=0;return "";},
  false(){status=1;return "";},
  sleep(){return "";},
  reboot(){return "System reboot is simulated.";},
  shutdown(){return "System shutdown is simulated.";}
};

function call(args,stdin=null){
  if(!args.length) return "";
  const command=args[0],argv=args.slice(1);
  if(aliases[command]) return call([...tokenize(aliases[command]),...argv],stdin);
  if(command==="clear"||command==="reset"){clearScreen();return "";}
  if(command==="help") return C.help();
  if(!Object.prototype.hasOwnProperty.call(C,command)) fail(command+": command not found");
  const result=C[command](argv,stdin);
  return result==null?"":String(result);
}

function runLine(source){
  const trimmed=source.trim();
  if(!trimmed) return;
  hist.push(source); histIndex=hist.length;
  print(user+"@kali:"+("/"+cwd.join("/"))+(user==="root"?"#":"$")+" "+source);
  try{
    let commandText=trimmed,redirect=null,append=false;
    const redirectMatch=commandText.match(/(?:^|\s)(>>|>)(?:\s*)([^>\s]+)\s*$/);
    if(redirectMatch){
      redirect=redirectMatch[2]; append=redirectMatch[1]===" >> ";
      commandText=commandText.slice(0,redirectMatch.index).trim();
    }
    const pipeline=commandText.split("|").map(part=>part.trim()).filter(Boolean);
    let result="";
    for(const part of pipeline) result=call(tokenize(part),result);
    status=0;
    if(redirect) write(redirect,result+(result&&!result.endsWith("\n")?"\n":""),append);
    else if(result!=="") print(result);
  }catch(error){
    status=1; print(error.message||"Command failed","error");
  }
  updatePrompt();
  screen.scrollTop=screen.scrollHeight;
}

form.addEventListener("submit",event=>{
  event.preventDefault();
  const command=input.value;
  input.value="";
  runLine(command);
});
input.addEventListener("keydown",event=>{
  if(event.key==="ArrowUp"){
    event.preventDefault();
    if(histIndex>0) histIndex--;
    input.value=hist[histIndex]||"";
  }else if(event.key==="ArrowDown"){
    event.preventDefault();
    if(histIndex<hist.length) histIndex++;
    input.value=hist[histIndex]||"";
  }else if(event.key==="Tab"){
    event.preventDefault();
    const value=input.value.trim();
    if(value&&!value.includes(" ")){
      const matches=Object.keys(C).filter(name=>name.startsWith(value));
      if(matches.length===1) input.value=matches[0]+" ";
    }
  }
});
screen.addEventListener("click",()=>input.focus());
updatePrompt();
input.focus();
</script>
